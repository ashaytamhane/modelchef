[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelchef"
version = "0.1.0"
description = "Recipe-driven language-model workbench for training, evaluation and serving"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
dashboard = ["tensorboard>=2.19,<3"]
optimizer-8bit = ["bitsandbytes>=0.48,<0.50"]
train = ["torch==2.13.0", "numpy==2.3.5"]
pipeline = ["pydantic>=2.10,<3", "tokenizers>=0.21,<0.24", "safetensors>=0.5,<1", "pyarrow>=18,<26"]
pretrained = ["transformers>=4.55,<5", "huggingface-hub>=0.34,<1"]
multimodal = ["transformers>=4.55,<5", "huggingface-hub>=0.34,<1", "pillow>=10.4,<13",
              "numpy==2.3.5", "pydantic>=2.10,<3", "safetensors>=0.5,<1"]
peft = ["peft>=0.17,<0.19", "transformers>=4.55,<5", "huggingface-hub>=0.34,<1"]
qlora = ["peft>=0.17,<0.19", "transformers>=4.55,<5", "bitsandbytes>=0.48,<0.50"]
nvfp4 = ["transformer-engine[pytorch]>=2.13,<3; platform_system == 'Linux'"]
evaluation = ["lm-eval[hf]>=0.4.10,<0.5"]
cuda-kernels = ["ninja>=1.11,<2"]
cuda13-toolchain = [
    "nvidia-cuda-nvcc==13.0.88; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-crt==13.0.88; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-nvvm==13.0.88; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
inference = ["vllm==0.31.0; platform_system == 'Linux'"]
aws = ["boto3>=1.40,<2"]
data = ["datasets>=3", "huggingface-hub>=0.30", "pyarrow>=18"]

[project.urls]
Repository = "https://github.com/ashaytamhane/modelchef"
Issues = "https://github.com/ashaytamhane/modelchef/issues"

[project.scripts]
modelchef = "modelchef.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
