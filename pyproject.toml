[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashayllm"
version = "0.1.0"
description = "Local-first foundation model training pipeline"
requires-python = ">=3.11,<3.13"
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
train = ["torch==2.13.0", "numpy==2.3.5"]
inference = ["vllm==0.31.0; platform_system == 'Linux'"]
aws = ["boto3>=1.40,<2"]
data = ["datasets>=3", "huggingface-hub>=0.30", "pyarrow>=18"]

[project.scripts]
ashayllm = "ashayllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
