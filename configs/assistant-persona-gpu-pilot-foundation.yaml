name: assistant-persona-gpu-pilot-foundation
explain: detailed
data:
  provider: local_jsonl
  dataset: curated-persona-research-foundation
  max_documents: 10000
  max_download_bytes: 16000000
  max_tokens: 500000
  storage: memory
  local_paths:
  - data/raw/assistant-persona-sample/foundation.jsonl
  - data/raw/assistant-persona-sample/social-reasoning-text.jsonl
  - data/raw/assistant-persona-sample/sensory-text.jsonl
processing:
  min_chars: 40
  max_chars: 30000
  near_dedup: false
  validation_fraction: 0.1
  test_fraction: 0.1
  strip_html: false
tokenizer:
  vocab_size: 32768
model:
  layers: 28
  hidden_size: 1024
  attention_heads: 16
  kv_heads: 4
  intermediate_size: 2816
  context_length: 2048
  gradient_checkpointing: true
  attention_kernel: auto
training:
  accelerator: cuda
  precision: fp16
  micro_batch_size: 1
  gradient_accumulation: 1
  learning_rate: 0.0005
  steps: 10
  warmup_steps: 1
  log_every: 1
  checkpoint_every: 5
  evaluate_every: 5
  max_runtime_seconds: 600
  deterministic: false
  optimizer_kernel: fused
  compile: false
evaluation:
  benchmark: none
  batches: 1
  generate_tokens: 8
  prompt: How can I help a friend who is disappointed?
stage:
  kind: pretrain
  prompt_format: user_assistant
  oversized_policy: skip
