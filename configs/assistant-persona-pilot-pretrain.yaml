# Longer CPU learning pilot using cached samples; not a production-quality model.
name: assistant-persona-pilot-pretrain
explain: detailed
data:
  provider: local_jsonl
  dataset: curated-persona-research-foundation
  max_documents: 10000
  max_download_bytes: 16000000
  max_tokens: 5000000
  storage: memory
  local_paths:
  - data/raw/assistant-persona-sample/foundation.jsonl
  - data/raw/assistant-persona-sample/social-reasoning-text.jsonl
  - data/raw/assistant-persona-sample/sensory-text.jsonl
processing:
  min_chars: 40
  max_chars: 30000
  near_dedup: false
  validation_fraction: 0.1
  test_fraction: 0.1
  strip_html: false
tokenizer:
  vocab_size: 2048
model:
  layers: 2
  hidden_size: 128
  attention_heads: 2
  kv_heads: 1
  intermediate_size: 352
  context_length: 4096
  gradient_checkpointing: false
  attention_kernel: auto
training:
  accelerator: cpu
  precision: fp32
  micro_batch_size: 1
  gradient_accumulation: 1
  learning_rate: 0.001
  steps: 200
  warmup_steps: 20
  log_every: 25
  checkpoint_every: 50
  evaluate_every: 50
  max_runtime_seconds: 1200
  deterministic: true
  optimizer_kernel: default
  compile: false
evaluation:
  benchmark: none
  batches: all
  generate_tokens: 48
  prompt: How can I help a friend who is disappointed?
stage:
  kind: pretrain
  prompt_format: user_assistant
