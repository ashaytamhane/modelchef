inference:
  model_path: artifacts/exports/ashayllm  # Local Hugging Face export; not a .pt checkpoint
  dtype: auto
  quantization: none  # nvfp4_per_token requires supported Blackwell CUDA hardware.
  gpu_memory_utilization: 0.5
  max_model_len: 2048
  max_num_seqs: 4
  enforce_eager: true
  port: 8000
  host: 127.0.0.1
  security:
    api_key_env: ASHAYLLM_API_KEY
    max_body_bytes: 1048576
    requests_per_minute: 30
    max_concurrent_requests: 2
    request_timeout_seconds: 120
