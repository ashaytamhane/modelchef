# Uses the scratch checkpoint from the preceding stage; never imports pretrained weights.
name: assistant-aws-smoke-sft
data:
  provider: local_jsonl
  dataset: modelchef-starter-fixture
  local_path: examples/starter/sft.jsonl
  max_documents: 12
  max_download_bytes: 100000
  max_tokens: 12000
processing:
  min_chars: 1
  near_dedup: false
training:
  accelerator: cuda
  precision: bf16
  steps: 4
  warmup_steps: 0
  micro_batch_size: 1
  gradient_accumulation: 1
  learning_rate: 0.00005
  checkpoint_every: 2
  evaluate_every: 2
  log_every: 1
  max_runtime_seconds: 300
evaluation:
  benchmark: none
  batches: 1
  generate_tokens: 8
stage:
  kind: sft
  parent_run: RESOLVED_BY_COOK
