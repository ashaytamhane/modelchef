# Bounded local integration sample; full AWS training uses separate data limits.
schema_version: 1
name: assistant-persona-research-sample
output_dir: data/raw/assistant-persona-sample
seed: 42
max_download_bytes: 16000000
timeout_seconds: 30
sources:
