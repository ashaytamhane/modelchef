  dataset: HuggingFaceFW/fineweb-edu
  subset: sample-10BT
  split: train
  adapter: text
  collection: foundation
  max_rows: 140
  max_example_bytes: 24000
  license: odc-by
  license_url: https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu#license
  attribution: FineWeb-Edu by the FineWeb authors and Hugging Face; underlying web
    documents retain their original rights.
  citations:
