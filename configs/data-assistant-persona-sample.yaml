- name: empathetic-dialogues
  dataset: brianist/empathetic_dialogues
  subset: default
  split: train
  adapter: empathy_turn
  collection: instruction-persona
  max_rows: 160
  max_example_bytes: 1600
  license: cc-by-nc-4.0
  license_url: https://github.com/facebookresearch/EmpatheticDialogues/blob/main/LICENSE
  attribution: EmpatheticDialogues by Hannah Rashkin, Eric Michael Smith, Margaret
    Li and Y-Lan Boureau. Parquet conversion by brianist; original noncommercial terms
    retained.
  citations:
  - title: 'Towards Empathetic Open-domain Conversation Models: a New Benchmark and
      Dataset (2019)'
    authors:
    - Hannah Rashkin
    - Eric Michael Smith
    - Margaret Li
    - Y-Lan Boureau
    url: https://arxiv.org/abs/1811.00207
  - title: EmpatheticDialogues Parquet mirror
    authors:
    - brianist
    url: https://huggingface.co/datasets/brianist/empathetic_dialogues
  system_prompt: Respond attentively to the user's feelings and situation. Be helpful
    and honest.
  system_prefix: 'Reasoning mode: disabled. Answer directly without a think block.'
  pretraining_collection: social-reasoning-text
- name: everyday-reasoning
  dataset: HuggingFaceTB/smoltalk2
  subset: SFT
  split: smoltalk_everyday_convs_reasoning_Qwen3_32B_think
  adapter: messages
  collection: reasoning
  max_rows: 500
  max_example_bytes: 6000
  license: apache-2.0
  license_url: https://huggingface.co/datasets/HuggingFaceTB/smoltalk2#license
  attribution: SmolTalk everyday conversations regenerated with Qwen3-32B by the SmolLM
    team. Teacher traces are synthetic and not verified evidence of correct reasoning.
  citations:
  - *id001
  - *id002
  reasoning: require
  system_prompt: Consider the user's situation carefully. Use a brief <think> explanation
    when reasoning is requested, then give the answer.
  min_user_words: 6
  system_prefix: 'Reasoning mode: enabled. Think briefly before answering.'
  pretraining_collection: social-reasoning-text
- name: lancaster-sensorimotor
  dataset: lancaster/sensorimotor-norms
  provider: https_csv
  source_url: https://osf.io/download/48wsc/
  adapter: measurements
  collection: sensory-text
  max_rows: 100
  max_example_bytes: 2400
  text_field: Word
  measurement_fields:
    Auditory.mean: hearing
    Gustatory.mean: taste
    Haptic.mean: touch
    Interoceptive.mean: internal bodily sensation
    Olfactory.mean: smell
    Visual.mean: vision
    Foot_leg.mean: foot or leg action
    Hand_arm.mean: hand or arm action
    Head.mean: head action
    Mouth.mean: mouth or throat action
    Torso.mean: torso action
  measurement_description: 'Lancaster Sensorimotor Norms: mean human ratings of how
    strongly a concept is experienced through each sense or action. Scale: 0 (not
    at all) to 5 (greatly). These are concept ratings, not pain intensity, EEG readings,
    or evidence that a language model feels sensations.'
  license: cc-by-4.0
  license_url: https://api.osf.io/v2/licenses/563c1cf88c5e4a3877f9e96a/
  attribution: Lancaster Sensorimotor Norms by Dermot Lynott, Louise Connell, Marc
    Brysbaert, James Brand and James Carney. Original aggregate ratings serialized
    as labeled text; numeric values preserved.
  citations:
  - title: 'The Lancaster Sensorimotor Norms: multidimensional measures of perceptual
      and action strength for 40,000 English words'
    authors:
    - Dermot Lynott
    - Louise Connell
    - Marc Brysbaert
    - James Brand
    - James Carney
    url: https://doi.org/10.3758/s13428-019-01316-z
