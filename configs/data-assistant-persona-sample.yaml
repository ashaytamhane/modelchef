- name: system-personas
  dataset: HuggingFaceTB/smoltalk2
  subset: SFT
  split: smoltalk_smollm3_systemchats_30k_no_think
  adapter: messages
  collection: instruction-persona
  max_rows: 100
  max_example_bytes: 1600
  license: apache-2.0
