schema_version: 1
name: starter
output_dir: artifacts/training
explain: detailed
data:
  provider: local_jsonl
  dataset: HuggingFaceFW/fineweb-edu
  subset: sample-10BT
  split: train
  text_field: text
  local_path: examples/starter/corpus.jsonl
  offset: 0
  max_documents: 12
  page_size: 50
  max_download_bytes: 100000
  timeout_seconds: 30
  max_tokens: 12000
  domain: general
  domain_keywords: []
processing:
  unicode_normalization: NFKC
  strip_html: true
  min_chars: 80
  max_chars: 20000
  min_alnum_fraction: 0.5
  max_repeated_line_fraction: 0.4
  exact_dedup: true
  near_dedup: false
  near_dedup_jaccard: 0.9
  dedup_ngram_words: 5
  pii: redact
  benchmark_files: []
  decontamination_ngram_words: 13
  validation_fraction: 0.1
  test_fraction: 0.1
tokenizer:
  algorithm: byte_bpe
  vocab_size: 512
  min_frequency: 2
  special_tokens:
  - <pad>
  - <unk>
  - <bos>
  - <eos>
  add_bos: false
  append_eos: true
model:
  peft:
    method: none
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules:
    - q_proj
    - v_proj
    use_rslora: false
    compute_dtype: bf16
    double_quant: true
  backend: native
  pretrained_path: null
  pretrained_config_sha256: null
  quantization: none
  attention_kernel: auto
  custom_swiglu_path: null
  type: decoder_rope
  num_experts: 4
  experts_per_token: 2
  router_aux_loss_coef: 0.01
  layers: 2
  hidden_size: 64
  attention_heads: 4
  kv_heads: 2
  intermediate_size: 192
  context_length: 64
  norm: rmsnorm
  norm_eps: 1.0e-05
  activation: swiglu
  rope_theta: 10000.0
  attention_dropout: 0.0
  residual_dropout: 0.0
  bias: false
  tie_embeddings: true
  init_std: 0.02
  gradient_checkpointing: false
training:
  distributed: none
  distributed_timeout_seconds: 300
  compile: false
  compile_backend: inductor
  compile_mode: default
  allow_tf32: false
  optimizer_kernel: default
  accelerator: cpu
  precision: fp32
  seed: 42
  deterministic: true
  steps: 4
  micro_batch_size: 1
  gradient_accumulation: 1
  optimizer: adamw
  learning_rate: 0.0005
  min_learning_rate_ratio: 0.1
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  optimizer_eps: 1.0e-08
  schedule: cosine
  warmup_steps: 0
  gradient_clip_norm: 1.0
  checkpoint_every: 2
  evaluate_every: 2
  log_every: 1
  max_runtime_seconds: 120
evaluation:
  benchmark: none
  benchmark_examples: 8
  benchmark_max_download_bytes: 2000000
  batches: 1
  prompt: A model predicts
  generate_tokens: 12
  temperature: 0.8
  top_k: 30
stage:
  kind: pretrain
  parent_run: null
  teacher_run: null
  distillation_temperature: 2.0
  distillation_alpha: 0.5
  dpo_beta: 0.1
  reward: integer
  group_size: 4
  rollout_tokens: 16
  kl_coefficient: 0.02
  clip_ratio: 0.2
  reasoning_format: plain
