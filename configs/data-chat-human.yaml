name: chat-human-1b-v1
output_dir: data/raw/chat-human-1b
seed: 42
max_download_bytes: 512000000
timeout_seconds: 120
sources:
- name: personachat
  dataset: bavard/personachat_truecased
  subset: full
  split: train
  adapter: persona_turn
  collection: conversation-pairs
  max_rows: 140000
  max_example_bytes: 6000
  license: cc-by-4.0
  license_url: https://raw.githubusercontent.com/facebookresearch/ParlAI/main/parlai/tasks/personachat/LICENSE_DOCUMENTATION
  attribution: PersonaChat by Zhang, Dinan, Urbanek, Szlam, Kiela and Weston. Truecasing/reformatting
    by bavard; this mirror is not an original-author release. Only the gold final
    candidate is used.
  citations:
  - title: 'Personalizing Dialogue Agents: I have a dog, do you have pets too? (2018)'
    authors:
    - Saizheng Zhang
    - Emily Dinan
    - Jack Urbanek
    - Arthur Szlam
    - Douwe Kiela
    - Jason Weston
    url: https://arxiv.org/abs/1801.07243
  - title: PersonaChat truecased mirror and transformations
    authors:
    - bavard
    url: https://huggingface.co/datasets/bavard/personachat_truecased
  system_prefix: ''
  pretraining_collection: conversation-text
  provider: hf_parquet
  reasoning: exclude
- name: empathetic-dialogues
  dataset: brianist/empathetic_dialogues
  subset: default
  split: train
  adapter: empathy_turn
  collection: conversation-pairs
  max_rows: 80000
  max_example_bytes: 6000
  license: cc-by-nc-4.0
  license_url: https://github.com/facebookresearch/EmpatheticDialogues/blob/main/LICENSE
  attribution: EmpatheticDialogues by Hannah Rashkin, Eric Michael Smith, Margaret
    Li and Y-Lan Boureau. Parquet conversion by brianist; original noncommercial terms
    retained.
  citations:
  - title: 'Towards Empathetic Open-domain Conversation Models: a New Benchmark and
      Dataset (2019)'
    authors:
    - Hannah Rashkin
    - Eric Michael Smith
    - Margaret Li
    - Y-Lan Boureau
    url: https://arxiv.org/abs/1811.00207
  - title: EmpatheticDialogues Parquet mirror
    authors:
    - brianist
    url: https://huggingface.co/datasets/brianist/empathetic_dialogues
  system_prompt: ''
  system_prefix: ''
  pretraining_collection: conversation-text
  provider: hf_parquet
  reasoning: exclude
