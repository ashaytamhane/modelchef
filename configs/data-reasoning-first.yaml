name: reasoning-first-mixture
output_dir: data/raw/reasoning-first-mixture
seed: 42
max_download_bytes: 2800000000
timeout_seconds: 120
sources:
- name: openthoughts-short
  dataset: open-thoughts/OpenThoughts-114k
  provider: hf_parquet
  subset: metadata
  split: train
  max_rows: 90000
  collection: reasoning-pairs
  pretraining_collection: reasoning-text
  adapter: reasoning_fields
  reasoning_fields:
    prompt: problem
    reasoning: deepseek_reasoning
    answer: deepseek_solution
  max_example_bytes: 3800
  reasoning: require
  license: apache-2.0
  license_url: https://huggingface.co/datasets/open-thoughts/OpenThoughts-114k
  attribution: OpenThoughts team; synthetic DeepSeek-R1 traces. Retain each original
    source and its applicable terms; dataset-level Apache-2.0 does not establish rights
    to every upstream problem. Research use. See source README for complete author
    list.
  citations:
  - title: 'OpenThoughts: Data Recipes for Reasoning Models (2025)'
    authors:
    - Etash Guha
    - Ryan Marten
    - OpenThoughts collaboration (complete author list in paper)
    url: https://arxiv.org/abs/2506.04178
- name: numina-worked
  dataset: AI-MO/NuminaMath-CoT
  provider: hf_parquet
  subset: default
  split: train
  max_rows: 50000
  collection: reasoning-pairs
  pretraining_collection: reasoning-text
  adapter: reasoning_fields
  reasoning_fields:
    prompt: problem
    reasoning: solution
    answer: solution
  max_example_bytes: 3800
  reasoning: require
  license: apache-2.0
  license_url: https://huggingface.co/datasets/AI-MO/NuminaMath-CoT#licensing-information
  attribution: NuminaMath authors; original exam/forum and synthetic source labels
    are retained. Dataset declares Apache-2.0; preserve constituent-source terms.
    Research use.
  citations:
  - title: NuminaMath (2024)
    authors:
    - Jia Li
    - Edward Beeching
    - Lewis Tunstall
    - Ben Lipkin
    - Roman Soletskyi
    - Shengyi Costa Huang
    - Kashif Rasul
    - Longhui Yu
    - Albert Jiang
    - Ziju Shen
    - Zihan Qin
    - Bin Dong
    - Li Zhou
    - Yann Fleureau
    - Guillaume Lample
    - Stanislas Polu
    url: https://github.com/project-numina/aimo-progress-prize/blob/main/report/numina_dataset.pdf
  answer_extraction: last_boxed
  exclude_sources:
  - gsm8k
  - math
  - amc_aime
