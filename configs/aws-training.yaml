# Resource settings for pipeline/cook --target aws --aws-config THIS_FILE.
# The CLI recipe overrides pipeline_config; aws-train uses pipeline_config directly.
# One deadline/budget reservation covers every stage in a cook workflow.
aws_test:
  profile: modelchef
  region: us-east-1
  instance_type: g4dn.xlarge
  total_budget_usd: '10.00'
  per_run_budget_usd: '0.50'
  max_runtime_minutes: 12
  max_spot_hourly_usd: '0.80'
  safety_reserve_usd: '0.15'
  storage_gb: 100
  ebs_gb_month_usd: '0.10'
  ipv4_hourly_usd: '0.005'
  ledger_path: .aws-runs/ledger.sqlite
  subnet_id: null
  ami_id: null
  ami_parameter: /aws/service/deeplearning/ami/x86_64/oss-nvidia-driver-gpu-pytorch-2.13-amazon-linux-2023/latest/ami-id
  ami_name: Deep Learning OSS Nvidia Driver AMI GPU PyTorch 2.13 (Amazon Linux 2023)
    ????????
  install_vllm: false
  pipeline_config: configs/pretrain-local.yaml
  artifact_bucket: YOUR_ARTIFACT_BUCKET
  instance_profile_name: YOUR_INSTANCE_PROFILE
  artifact_prefix: modelchef-training
  max_bundle_bytes: 512000000
  max_result_bytes: 512000000
  artifact_cost_reserve_usd: '0.05'
