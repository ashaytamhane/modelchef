name: assistant-persona-350m-pretrain
explain: detailed
data:
  provider: local_jsonl
  dataset: curated-persona-research-foundation
  max_documents: 10000000
  max_download_bytes: 100000000000
  max_tokens: 8000000000
  storage: disk
  local_paths:
  - data/raw/assistant-persona-350m/foundation.jsonl
  - data/raw/assistant-persona-350m/social-reasoning-text.jsonl
  - data/raw/assistant-persona-350m/sensory-text.jsonl
processing:
  min_chars: 100
  max_chars: 30000
  near_dedup: false
  validation_fraction: 0.01
  test_fraction: 0.01
  strip_html: false
tokenizer:
  vocab_size: 32768
  training_max_documents: 5000
model:
  layers: 28
  hidden_size: 1024
  attention_heads: 16
  kv_heads: 4
  intermediate_size: 2816
  context_length: 2048
  gradient_checkpointing: true
  attention_kernel: auto
training:
  accelerator: cuda
  precision: bf16
  micro_batch_size: 8
  gradient_accumulation: 4
  learning_rate: 0.0003
  steps: 100000
  warmup_steps: 1000
  log_every: 100
  checkpoint_every: 500
  evaluate_every: 500
  max_runtime_seconds: 1440000
  deterministic: false
  optimizer_kernel: fused
  compile: false
  allow_tf32: true
  performance_gate:
    probe_steps: 50
    warmup_steps: 10
    safety_multiplier: 1.5
    overhead_seconds: 1800
    max_allocated_memory_fraction: 0.9
evaluation:
  benchmark: none
  batches: 1
  generate_tokens: 8
  prompt: How can I help a friend who is disappointed?
stage:
  kind: pretrain
  prompt_format: user_assistant
  oversized_policy: skip
