schema_version: 1
name: vision-sft
modality: vision
output_dir: artifacts/multimodal
data:
  manifest: data/vision/train.jsonl
  max_records: 128
  max_media_bytes: 16000000
  max_total_media_bytes: 256000000
  max_image_pixels: 4000000
model:
  path: artifacts/models/vision-model
  vision_format: chat
  attention_kernel: auto
  freeze_encoders: false
  gradient_checkpointing: false
max_text_tokens: 2048
training:
  accelerator: auto
  precision: auto
  micro_batch_size: 1
  gradient_accumulation: 4
  steps: 40
  warmup_steps: 4
  learning_rate: 0.00001
  checkpoint_every: 10
  evaluate_every: 10
  log_every: 1
  max_runtime_seconds: 600
evaluation:
  max_examples: 8
  max_new_tokens: 64
