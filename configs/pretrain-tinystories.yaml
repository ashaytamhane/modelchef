# From scratch: bounded TinyStories experiment, not a general chat assistant.
# See docs/SCRATCH_TRAINING.md for budgets, sampling and evaluation limits.
schema_version: 1
name: tinystories-scratch
output_dir: artifacts/training
explain: detailed
data:
  provider: hf_rows
  dataset: roneneldan/TinyStories
  subset: default
  split: train
  text_field: text
  local_path: null
  offset: 0
  max_documents: 100000
  page_size: 100
  max_download_bytes: 1000000000
  timeout_seconds: 30
  max_tokens: 64000000
  domain: general
  domain_keywords: []
processing:
  unicode_normalization: NFKC
  strip_html: true
  min_chars: 100
  max_chars: 20000
  min_alnum_fraction: 0.5
  max_repeated_line_fraction: 0.4
  exact_dedup: true
  near_dedup: false
  near_dedup_jaccard: 0.9
  dedup_ngram_words: 5
  pii: redact
  benchmark_files: []
  decontamination_ngram_words: 13
  validation_fraction: 0.02
  test_fraction: 0.02
tokenizer:
  algorithm: byte_bpe
  vocab_size: 8192
  min_frequency: 2
  special_tokens:
  - <pad>
  - <unk>
  - <bos>
  - <eos>
  add_bos: false
  append_eos: true
model:
  backend: native
  pretrained_path: null
  pretrained_config_sha256: null
  quantization: none
  type: decoder_rope
  layers: 6
  hidden_size: 512
  attention_heads: 8
  kv_heads: 2
  intermediate_size: 1360
  context_length: 512
  norm: rmsnorm
  norm_eps: 1.0e-05
  activation: swiglu
  rope_theta: 10000.0
  attention_dropout: 0.0
  residual_dropout: 0.0
  bias: false
  tie_embeddings: true
  init_std: 0.02
  gradient_checkpointing: false
training:
  accelerator: cuda
  precision: bf16
  seed: 42
  deterministic: false
  steps: 12000
  micro_batch_size: 8
  gradient_accumulation: 4
  optimizer: adamw
  learning_rate: 0.0006
  min_learning_rate_ratio: 0.1
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  optimizer_eps: 1.0e-08
  schedule: cosine
  warmup_steps: 600
  gradient_clip_norm: 1.0
  checkpoint_every: 1000
  evaluate_every: 500
  log_every: 50
  max_runtime_seconds: 18000
  optimizer_kernel: fused
evaluation:
  benchmark: none
  benchmark_examples: 8
  benchmark_max_download_bytes: 2000000
  batches: 16
  prompt: Once upon a time, a little fox found
  generate_tokens: 160
  temperature: 0.7
  top_k: 40
stage:
  kind: pretrain
  parent_run: null
  teacher_run: null
  distillation_temperature: 2.0
  distillation_alpha: 0.5
  dpo_beta: 0.1
  reward: integer
  group_size: 4
  rollout_tokens: 16
  kl_coefficient: 0.02
  clip_ratio: 0.2
