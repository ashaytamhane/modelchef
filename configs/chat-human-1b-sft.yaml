name: chat-human-1b-replies
explain: detailed
data:
  provider: local_jsonl
  dataset: chat-human-v1
  storage: memory
  local_path: data/raw/chat-human-1b/conversation-pairs.jsonl
  max_documents: 250000
  max_download_bytes: 2000000000
  max_tokens: 100000000
  domain: general
processing:
  min_chars: 20
  max_chars: 20000
  near_dedup: false
  validation_fraction: 0.05
  test_fraction: 0.05
  strip_html: false
  pii: redact
tokenizer:
  vocab_size: 8192
  training_max_documents: null
  packing: concatenate
  add_bos: true
model:
  layers: 40
  hidden_size: 1536
  attention_heads: 24
  kv_heads: 6
  intermediate_size: 4096
  context_length: 2048
  gradient_checkpointing: true
  attention_kernel: auto
training:
  accelerator: cuda
  precision: bf16
  micro_batch_size: 1
  gradient_accumulation: 1
  learning_rate: 3.0e-05
  steps: 5000
  warmup_steps: 100
  log_every: 100
  checkpoint_every: 1000
  evaluate_every: 1000
  max_runtime_seconds: 172800
  deterministic: false
  optimizer_kernel: default
  compile: false
  allow_tf32: true
  optimizer: adamw8bit_in_backward
  gradient_clip_norm: 0
  checkpoint_at_start: true
  weight_decay: 0.01
evaluation:
  benchmark: none
  batches: 16
  generate_tokens: 100
  prompt: 'User: Hi, my name is Ashay.

    Assistant:'
  temperature: 0.7
stage:
  kind: sft
  prompt_format: chat_transcript
  oversized_policy: skip
  parent_run: artifacts/training/PARENT_RUN
