name: starter-sft
data:
  provider: local_jsonl
  local_path: examples/starter/sft.jsonl
  max_documents: 12
  max_download_bytes: 100000
  max_tokens: 12000
processing:
  min_chars: 1
  near_dedup: false
training:
  accelerator: cpu
  precision: fp32
  steps: 4
  warmup_steps: 0
  micro_batch_size: 1
  gradient_accumulation: 1
  learning_rate: 5.0e-05
  evaluate_every: 2
  checkpoint_every: 2
  log_every: 1
  max_runtime_seconds: 120
evaluation:
  benchmark: none
  batches: 1
  generate_tokens: 12
stage:
  kind: sft
  parent_run: RESOLVED_BY_COOK
