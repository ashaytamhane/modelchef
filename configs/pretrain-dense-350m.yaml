# Scale exploration, not a proven quality recipe. Requires curated local corpus.
# See docs/SCRATCH_TRAINING.md; measure throughput and approve cloud budget explicitly.
data:
  dataset: curated-local-corpus
  domain: general
  domain_keywords: []
  local_path: data/raw/corpus.jsonl
  max_documents: 10000000
  max_download_bytes: 50000000000
  max_tokens: 8000000000
  offset: 0
  page_size: 100
  provider: local_jsonl
  split: train
  subset: default
  text_field: text
  timeout_seconds: 30
  storage: disk
evaluation:
  batches: 16
  benchmark: none
  benchmark_examples: 8
  benchmark_max_download_bytes: 2000000
  generate_tokens: 128
  prompt: Explain how
  temperature: 0.7
  top_k: 40
explain: detailed
model:
  activation: swiglu
  attention_dropout: 0.0
  attention_heads: 16
  backend: native
  bias: false
  context_length: 1024
  gradient_checkpointing: true
  hidden_size: 1024
  init_std: 0.02
  intermediate_size: 3072
  kv_heads: 4
  layers: 26
  norm: rmsnorm
  norm_eps: 1.0e-05
  pretrained_config_sha256: null
  pretrained_path: null
  quantization: none
  residual_dropout: 0.0
  rope_theta: 10000.0
  tie_embeddings: true
  type: decoder_rope
name: dense-350m-scratch
output_dir: artifacts/training
processing:
  benchmark_files: []
  decontamination_ngram_words: 13
  dedup_ngram_words: 5
  exact_dedup: true
  max_chars: 20000
  max_repeated_line_fraction: 0.4
  min_alnum_fraction: 0.5
  min_chars: 100
  near_dedup: true
  near_dedup_jaccard: 0.9
  pii: redact
  strip_html: true
  test_fraction: 0.01
  unicode_normalization: NFKC
  validation_fraction: 0.01
schema_version: 1
stage:
  clip_ratio: 0.2
  distillation_alpha: 0.5
  distillation_temperature: 2.0
  dpo_beta: 0.1
  group_size: 4
  kind: pretrain
  kl_coefficient: 0.02
  parent_run: null
  reward: integer
  rollout_tokens: 16
  teacher_run: null
tokenizer:
  add_bos: false
  algorithm: byte_bpe
  append_eos: true
  min_frequency: 2
  special_tokens:
  - <pad>
  - <unk>
  - <bos>
  - <eos>
  vocab_size: 32000
training:
  accelerator: cuda
  betas:
  - 0.9
  - 0.95
  checkpoint_every: 2000
  deterministic: false
  evaluate_every: 1000
  gradient_accumulation: 8
  gradient_clip_norm: 1.0
  learning_rate: 0.0003
  log_every: 100
  max_runtime_seconds: 259200
  micro_batch_size: 4
  min_learning_rate_ratio: 0.1
  optimizer: adamw
  optimizer_eps: 1.0e-08
  optimizer_kernel: fused
  precision: bf16
  schedule: cosine
  seed: 42
  steps: 200000
  warmup_steps: 2000
  weight_decay: 0.1
