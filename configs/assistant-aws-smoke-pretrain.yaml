# Tiny integration test only. This checkpoint is not a useful assistant.
name: assistant-aws-smoke-pretrain
explain: detailed
data:
  provider: local_jsonl
  dataset: modelchef-starter-fixture
  local_path: examples/starter/corpus.jsonl
  max_documents: 12
  max_download_bytes: 100000
  max_tokens: 12000
processing:
  min_chars: 80
  near_dedup: false
tokenizer:
  vocab_size: 512
model:
  layers: 2
  hidden_size: 64
  attention_heads: 4
  kv_heads: 2
  intermediate_size: 192
  context_length: 64
training:
  accelerator: cuda
  precision: bf16
  steps: 4
  warmup_steps: 0
  micro_batch_size: 1
  gradient_accumulation: 1
  checkpoint_every: 2
  evaluate_every: 2
  log_every: 1
  max_runtime_seconds: 300
evaluation:
  benchmark: none
  batches: 1
  generate_tokens: 8
stage:
  kind: pretrain
