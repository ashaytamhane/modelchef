# Hardware throughput comparison; identical corpus and architecture, different compiler policy.
data:
  dataset: curated-persona-research-foundation
  local_paths:
  - data/raw/assistant-persona-sample/foundation.jsonl
  - data/raw/assistant-persona-sample/social-reasoning-text.jsonl
  - data/raw/assistant-persona-sample/sensory-text.jsonl
  max_documents: 10000
  max_download_bytes: 16000000
  max_tokens: 500000
  provider: local_jsonl
  storage: memory
evaluation:
  batches: 1
  benchmark: none
  generate_tokens: 8
  prompt: How can I help a friend who is disappointed?
explain: detailed
model:
  attention_heads: 16
  attention_kernel: auto
  context_length: 2048
  gradient_checkpointing: true
  hidden_size: 1024
  intermediate_size: 2816
  kv_heads: 4
  layers: 28
name: assistant-persona-kernel-pilot-compiled
processing:
  max_chars: 30000
  min_chars: 40
  near_dedup: false
  strip_html: false
  test_fraction: 0.1
  validation_fraction: 0.1
stage:
  kind: pretrain
  oversized_policy: skip
  prompt_format: user_assistant
tokenizer:
  vocab_size: 32768
training:
  accelerator: cuda
  checkpoint_every: 200
  compile: true
  deterministic: false
  evaluate_every: 10000
  gradient_accumulation: 1
  learning_rate: 0.0005
  log_every: 10
  max_runtime_seconds: 900
  micro_batch_size: 8
  optimizer_kernel: fused
  precision: bf16
  steps: 100
  warmup_steps: 10
  compile_mode: default
