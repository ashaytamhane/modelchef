name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU PyTorch and project extras
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 -e '.[dev,pipeline,pretrained,peft,aws,multimodal]'
      - name: Check code and documentation
        run: |
          python -m ruff check src tests scripts/check_docs.py
          python scripts/check_docs.py
      - name: Test local pipeline and integrations
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: python -m pytest -q
      - name: Build a distributable wheel
        run: python -m pip wheel --no-deps . --wheel-dir artifacts/build
  windows-controller:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,pipeline,aws,multimodal]'
      - run: python -m pytest -q
      - run: python scripts/check_docs.py
